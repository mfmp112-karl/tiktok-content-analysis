name: check-docs

# Every push and PR, unlike selftest.yml — this needs no network and costs
# nothing, so there's no reason to wait for a schedule. See
# scripts/check_docs.py for exactly what it checks.
on:
  push:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
